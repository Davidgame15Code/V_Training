async function doExport(){
 setM('Preparing backup\u2026');
 try{
  const photos=[];for(const p of PH)photos.push({id:p.id,t:p.t,d:await b2d(p.b)});
  const blob=new Blob([JSON.stringify({app:'v-training',v:1,at:Date.now(),unit:S.unit,history:S.history,goals:S.goals,bw:S.bw,sv:S.sv,photos})],{type:'application/json'});
  const name='v-training-backup-'+new Date().toISOString().slice(0,10)+'.json',f=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
   try{await navigator.share({files:[f],title:'V training backup'});setM('Backup ready. Choose Save to Files to keep it.');return}
   catch(e){if(e&&e.name==='AbortError'){setM('');return}}
  }
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),6e4);
  setM('Backup saved as '+name+'.');
 }catch(e){setM('Could not create the backup.')}
}
async function doImport(f){
 setM('Importing\u2026');
 try{
  const j=JSON.parse(await f.text());
  if(!j||(j.app!=='v-training'&&j.app!=='reps')||!Array.isArray(j.history))throw 0;
  const had=S.history.length,have=new Set(S.history.map(w=>w.t));let a=0,p=0;
  j.history.forEach(w=>{if(w&&w.t&&w.name&&Array.isArray(w.ex)&&!have.has(w.t)){S.history.push(w);have.add(w.t);a++}});
  S.history.sort((x,y)=>x.t-y.t);
  if(+j.bw>0&&+j.bw<1000&&!S.bw)S.bw=+j.bw;
  if(j.sv&&typeof j.sv==='object')for(const k in j.sv)if(/^\d{4}-\d\d-\d\d$/.test(k)&&/^\d{4}-\d\d$/.test(j.sv[k])&&!S.sv[k])S.sv[k]=j.sv[k];
  if(j.goals&&typeof j.goals==='object')for(const k in j.goals){const n=+j.goals[k];if(/^\d{4}-\d\d-\d\d$/.test(k)&&n>=1&&n<=7&&!S.goals[k])S.goals[k]=Math.round(n)}
  if(!had&&(j.unit==='kg'||j.unit==='lb'))S.unit=j.unit;
  const ids=new Set(PH.map(x=>x.id));
  for(const r of (j.photos||[])){
   if(!r||!r.id||ids.has(r.id)||typeof r.d!=='string'||r.d.slice(0,11)!=='data:image/')continue;
   const b=d2b(r.d);await tx('readwrite',s=>s.put({id:r.id,t:r.t,b}));
   PH.push({id:r.id,t:r.t,b,d:URL.createObjectURL(b)});ids.add(r.id);p++;
  }
  PH.sort((x,y)=>y.t-x.t);save();render();
  setM('Added '+a+' workout'+(a===1?'':'s')+' and '+p+' photo'+(p===1?'':'s')+'.');
 }catch(e){setM('That file is not a V training backup.')}
}

function cpInit(){
 const c=$('#cw');if(!c)return;const x=c.getContext('2d'),W=c.width,R=W/2,im=x.createImageData(W,W),d=im.data;
 for(let j=0;j<W;j++)for(let i=0;i<W;i++){const dx=i+.5-R,dy=j+.5-R,r=Math.hypot(dx,dy);if(r>R)continue;const q=hsv2rgb((Math.atan2(dy,dx)*180/Math.PI+360)%360,r/R,1),p=(j*W+i)*4;d[p]=q[0];d[p+1]=q[1];d[p+2]=q[2];d[p+3]=255}
 x.putImageData(im,0,0);
 let down=false;const mv=e=>{const b=c.getBoundingClientRect(),nx=(e.clientX-b.left)/b.width*2-1,ny=(e.clientY-b.top)/b.height*2-1;cpS.h=(Math.atan2(ny,nx)*180/Math.PI+360)%360;cpS.s=Math.min(1,Math.hypot(nx,ny));cpApply()};
 c.addEventListener('pointerdown',e=>{down=true;try{c.setPointerCapture(e.pointerId)}catch(_){}mv(e);e.preventDefault()});
 c.addEventListener('pointermove',e=>{if(down)mv(e)});
 const up=()=>{if(down){down=false;save()}};c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
 cpSync();
}

 const mk=$$('#cwm');if(mk){mk.style.left=(50+cpS.s*Math.cos(cpS.h*Math.PI/180)*50)+'%';mk.style.top=(50+cpS.s*Math.sin(cpS.h*Math.PI/180)*50)+'%'}

}

 if(pu&&pu.h0){const S=[P.xs,P.ys],W=[P.xs,pu.floor],a=pu.h0/2,d=W[1]-S[1],k=Math.sqrt(Math.max(0,a*a-d*d/4)),E=[P.xs+(pu.head===0?1:-1)*k,(S[1]+W[1])/2];
  x.strokeStyle=x.fillStyle='#38bdf8';x.beginPath();x.moveTo(S[0],S[1]);x.lineTo(E[0],E[1]);x.lineTo(W[0],W[1]);x.stroke();x.beginPath();x.arc(E[0],E[1],1.7,0,6.3);x.fill()}
}
function puSay(t,now){if(now-pu.vt>2500){pu.vt=now;say(t)}}
function puStep(g,now){
 const el=now-pu.t,cn=$('#cn'),cf=$('#cf');
 if(pu.ph==='bg'){
  cn.textContent='Step out of view: '+Math.max(0,Math.ceil((3000-el)/1000));
  if(el>1500){if(!pu.acc)pu.acc=new Float32Array(GN);for(let k=0;k<GN;k++)pu.acc[k]+=g[k];pu.na++}
  if(el>=3000&&pu.na){pu.bg=pu.acc.map(q=>q/pu.na);pu.ph='pos';pu.t=now;say('Get in position')}
  return;
 }
 const B=puBody(puMask(g,pu.bg));
 if(B.n<60||B.w<GW*.25){puDraw(null);cn.textContent=pu.ph==='pos'?'Get into the top of a push-up, side-on to the phone':'Body not in view';if(cf)cf.textContent='';return}
 const P=puPose(B,pu.ph==='count'?pu.head:B.head);
 if(pu.ph==='pos'){
  const left=Math.max(0,Math.ceil((5000-el)/1000));cn.textContent='Hold the top of a push-up, side-on: '+left;
  if(P){pu.hh.push(P.ys);pu.dd.push(P.dev);pu.fl.push(B.y1);if(pu.hh.length>14){pu.hh.shift();pu.dd.shift();pu.fl.shift()}}
  puDraw(P,true);
  if(el>=5000){
   const med=a=>a.slice().sort((p,q)=>p-q)[a.length>>1];
   if(B.w<B.h*1.3){pu.t=now-3000;cn.textContent='Lie side-on to the phone with your whole body in view';puSay('Side on, whole body in view',now)}
   else if(B.x0<=1||B.x1>=GW-2){pu.t=now-3000;cn.textContent='Move the phone back so your whole body fits';puSay('Move the phone back',now)}
   else if(!P||pu.hh.length<8){pu.t=now-4000}
   else{
    const fl=med(pu.fl),h0=fl-med(pu.hh),spread=Math.max(...pu.hh)-Math.min(...pu.hh);
    if(h0<6||spread>Math.max(2,.12*h0)){pu.t=now-3000;cn.textContent='Hold still at the top of the push-up';puSay('Hold still at the top',now)}
    else{pu.head=B.head;pu.W0=B.w;pu.floor=fl;pu.h0=h0;pu.dev0=med(pu.dd);pu.fx0=pu.head===0?B.x1:B.x0;pu.rs=1;pu.dn=0;pu.dvs=undefined;pu.ph='count';pu.t=now;pu.msg='';say('Go')}
   }
  }
  return;
 }
 if(!P){puDraw(null);return}
 const fx=pu.head===0?B.x1:B.x0,still=Math.abs(fx-pu.fx0)<=Math.max(3,pu.W0*.12)&&B.w>pu.W0*.6;
 const r=Math.max(.05,Math.min(1.1,(pu.floor-P.ys)/pu.h0));pu.rs=pu.rs*.5+r*.5;
 pu.dvs=pu.dvs===undefined?P.dev-pu.dev0:pu.dvs*.5+(P.dev-pu.dev0)*.5;
 const rr=Math.min(1,pu.rs),elb=Math.round(2*Math.asin(rr)*180/Math.PI),dv=pu.dvs,straight=Math.abs(dv)<=PU_DEV;
 pu.elb=elb;pu.dv=dv;puDraw(P,straight);
 cf.innerHTML='Elbow ~'+elb+'\u00b0 \u00b7 hips '+(straight?'straight':dv>0?'sagging':'too high')+(pu.msg?'<br>'+pu.msg:'');
 if(!still){cn.textContent='Hold your feet still. Move only your upper body.';return}
 cn.textContent='Counting. Do your push-ups.';
 if(!pu.dn){if(pu.rs<PU_START){pu.dn=1;pu.rmin=pu.rs;pu.dmax=Math.abs(dv);pu.ts=now}}
 else{
  pu.rmin=Math.min(pu.rmin,pu.rs);pu.dmax=Math.max(pu.dmax,Math.abs(dv));
  if(pu.rs>=PU_UP){
   pu.dn=0;const dur=now-pu.ts,emin=Math.round(2*Math.asin(Math.min(1,pu.rmin))*180/Math.PI);
   if(dur<450)return;
   if(pu.rmin>PU_DEEP){pu.msg='Not counted: go lower (elbow only ~'+emin+'\u00b0)';puSay('Go lower',now)}
   else if(pu.dmax>PU_DEV){pu.msg='Not counted: keep your body straight';puSay('Keep your body straight',now)}
   else{pu.n++;pu.msg='Rep '+pu.n+' counted. Elbow ~'+emin+'\u00b0';$('#pcn').textContent=pu.n;say(String(pu.n))}
  }
 }
}

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

render();toTop();
