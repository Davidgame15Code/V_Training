<script>
const KEY='reps.v1'; /* legacy storage name, kept so existing workouts survive the rename */
let S={history:[],unit:'lb',active:null,goals:{},sv:{},set:{mode:'dark',color:'Blue',size:100}},rest=null,tm=null,hasUnit=false;
try{
 const r=localStorage.getItem(KEY);
 if(r){
  const p=JSON.parse(r);
  if(Array.isArray(p.history))S.history=p.history;
  if(p.sv&&typeof p.sv==='object')for(const k in p.sv)if(/^\d{4}-\d\d-\d\d$/.test(k)&&/^\d{4}-\d\d$/.test(p.sv[k]))S.sv[k]=p.sv[k];
  if(p.set&&typeof p.set==='object'){const q=p.set;if(['dark','light','auto'].includes(q.mode))S.set.mode=q.mode;if(typeof q.color==='string'&&q.color.length<12)S.set.color=q.color;if([90,100,115,130].includes(+q.size))S.set.size=+q.size}
  if(p.goals&&typeof p.goals==='object')for(const k in p.goals){const n=+p.goals[k];if(/^\d{4}-\d\d-\d\d$/.test(k)&&n>=1&&n<=7)S.goals[k]=Math.round(n)}
  if(p.unit==='kg'||p.unit==='lb'){S.unit=p.unit;hasUnit=true}
  const a=p.active;
  if(a&&typeof a.name==='string'&&typeof a.t==='number'&&Array.isArray(a.ex)&&a.ex.every(e=>e&&typeof e.n==='string'&&Array.isArray(e.sets))){
   S.active=a;
   if(typeof p.rest==='number'&&p.rest>Date.now())rest=p.rest;
   const t=p.tm;
   if(t&&a.ex[t.i]&&a.ex[t.i].sets[t.j]&&typeof t.end==='number')tm=t;
  }
 }
}catch(e){}
if(!hasUnit)S.unit=(S.history[S.history.length-1]||{}).u||'lb';
const HUES={Blue:207,Indigo:238,Purple:268,Magenta:300,Pink:330,Red:355,Orange:24,Gold:42,Green:140,Teal:182,Graphite:215};
function applyTheme(){

async function startStream(){
 stopStream();
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:face},audio:false});
  const v=$('#cv');if(!v){stopStream();return}
  v.srcObject=stream;await v.play().catch(()=>{});
 }catch(e){showCam(BLOCK)}
}
async function openCam(){
 shots=0;
 if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){showCam(BLOCK);return}
 try{const q=await navigator.permissions.query({name:'camera'});if(q.state==='denied'){showCam(BLOCK);return}}catch(e){}
 showCam('');startStream();
}
function closeCam(){puStop();stopStream();ov().hidden=true;ov().innerHTML='';render()}
async function snap(){
 const v=$('#cv');if(!v||!v.videoWidth)return;
 const k=Math.min(1,900/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');
 c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);
 const x=c.getContext('2d');if(face==='user'){x.translate(c.width,0);x.scale(-1,1)}
 x.drawImage(v,0,0,c.width,c.height);
 const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.72));if(!b)return;
 const p={id:Date.now()+'-'+Math.random().toString(36).slice(2,6),t:Date.now(),b,d:URL.createObjectURL(b)};
 v.style.opacity=.3;setTimeout(()=>{v.style.opacity=1},120);
 try{await tx('readwrite',s=>s.put({id:p.id,t:p.t,b}))}catch(e){}
 PH.unshift(p);shots++;const n=$('#cn');if(n)n.textContent='Saved. Taken: '+shots;
}
function show(i,fade){
 const a=$('#pa'),b=$('#pb'),f=pl.f[i];if(!a)return;
 $('#pc').textContent=dstr(f.t,{month:'long',year:'numeric'})+'  '+(i+1)+' of '+pl.f.length;
 b.style.transition='none';b.style.opacity=0;
 if(!fade||i===0){a.src=f.d;return}
 b.src=f.d;void b.offsetWidth;b.style.transition='opacity 1s linear';b.style.opacity=1;
 setTimeout(()=>{if(pl&&$('#pa')){a.src=f.d;b.style.transition='none';b.style.opacity=0}},1050);
}
function tickPlay(){
 if(!pl)return;
 if(!pl.paused){pl.i=(pl.i+1)%pl.f.length;show(pl.i,pl.fade)}
 pl.t=setTimeout(tickPlay,pl.i===pl.f.length-1?2400:(pl.fade?1600:1000));
}

function progv(){
 const h=S.history,now=Date.now(),W=6048e5;
 if(!h.length)return '<h1>Progress</h1><p class="empty">Finish a workout and your progress will show up here.</p>';
 const sets=h.reduce((n,w)=>n+w.ex.reduce((m,e)=>m+e.sets.length,0),0);
 const vol=h.reduce((n,w)=>n+w.ex.reduce((m,e)=>m+e.sets.reduce((k,s)=>k+(+s.w||0)*(+s.r||0),0),0),0);
 const bars=Array.from({length:8},(_,i)=>h.filter(w=>{const a=now-w.t;return a>=(7-i)*W&&a<(8-i)*W}).length),mx=Math.max(1,...bars);
 const names=[...new Set(h.flatMap(w=>w.ex.map(e=>e.n)))].sort();
 if(!names.includes(pe))pe=names[0];
 const isW=h.some(w=>w.ex.some(e=>e.n===pe&&e.sets.some(s=>+s.w>0)));
 const pts=h.filter(w=>w.ex.some(e=>e.n===pe)).map(w=>Math.max(...w.ex.find(x=>x.n===pe).sets.map(s=>+(isW?s.w:s.r)||0)));
 const lo=Math.min(...pts),hi=Math.max(...pts),sp=hi-lo||1,k=pts.length>1?280/(pts.length-1):0;
 const xy=pts.map((v,i)=>[pts.length>1?Math.round(10+i*k):150,Math.round(100-(v-lo)/sp*80)]);
 const unit=isW?S.unit:((L[pe]||{}).u||'reps'),d=pts[pts.length-1]-pts[0];
 return '<h1>Progress</h1><div class="tl"><div><b>'+h.length+'</b>workouts</div><div><b>'+bars[7]+'</b>last 7 days</div><div><b>'+sets+'</b>sets done</div><div><b>'+Math.round(vol).toLocaleString()+'</b>'+S.unit+' lifted</div></div>'+
 '<h2>Workouts per week</h2><div class="wb">'+bars.map(c=>'<i style="height:'+Math.round(c/mx*100)+'%"><b>'+c+'</b></i>').join('')+'</div><div class="wl"><span>8 weeks ago</span><span>last 7 days</span></div>'+
 '<h2>Exercise progress</h2><select id="pes" aria-label="Exercise">'+names.map(n=>'<option'+(n===pe?' selected':'')+'>'+esc(n)+'</option>').join('')+'</select>'+
 '<div class="cht"><svg viewBox="0 0 300 110" role="img" aria-label="Progress chart for '+esc(pe)+'"><polyline points="'+xy.map(q=>q.join(',')).join(' ')+'" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round"/>'+xy.map(q=>'<circle cx="'+q[0]+'" cy="'+q[1]+'" r="4" fill="var(--acc)"/>').join('')+'</svg></div>'+
 '<p class="sub">'+pts.length+' session'+(pts.length>1?'s':'')+'. First: '+pts[0]+' '+unit+'. Latest: '+pts[pts.length-1]+' '+unit+(pts.length>1?' ('+(d>=0?'+':'')+d+')':'')+'.</p>';
}

function beepInit(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.resume)ac.resume()}catch(e){}}
function beep(){try{if(!ac)return;const o=ac.createOscillator();o.connect(ac.destination);o.frequency.value=880;o.start();o.stop(ac.currentTime+.3)}catch(e){}}

function puStop(){if(pu){clearInterval(pu.iv);pu=null}}
async function puStart(i){
 if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){showCam(BLOCK);return}
 try{const q=await navigator.permissions.query({name:'camera'});if(q.state==='denied'){showCam(BLOCK);return}}catch(e){}
 face='user';
 pu={i,ph:'ready',n:0,t:0,acc:null,na:0,bg:null,s:null,mn:null,mx:0,pp:0,last:0};
 const o=ov();o.hidden=false;
 o.innerHTML='<video id="cv" class="mir" playsinline muted autoplay></video><div class="cn" id="cn">Lean your phone upright, screen facing you, so your whole body is in view from the side. Tap Start, then step out of view.</div><div class="pc" id="pcn">0</div><div class="cb"><button class="cs" data-a="pux">Cancel</button><button class="cs" data-a="pum">-1</button><button class="cs" data-a="pugo">Start</button><button class="cs" data-a="pup">+1</button></div>';
 startStream();
 pu.iv=setInterval(puLoop,70);
}
function puLoop(){
 const v=$('#cv');if(!pu||!v||!v.videoWidth||pu.ph==='ready')return;
 const x=cvs.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,64,48);
 const D=x.getImageData(0,0,64,48).data,g=new Float32Array(3072);
 for(let k=0;k<3072;k++)g[k]=(D[4*k]+D[4*k+1]+D[4*k+2])/3;
 const now=Date.now(),el=now-pu.t,cn=$('#cn');
 if(pu.ph==='bg'){
  cn.textContent='Step out of view: '+Math.max(0,Math.ceil((3000-el)/1000));
  if(el>1500){if(!pu.acc)pu.acc=new Float32Array(3072);for(let k=0;k<3072;k++)pu.acc[k]+=g[k];pu.na++}
  if(el>=3000&&pu.na){pu.bg=pu.acc.map(q=>q/pu.na);pu.ph='pos';pu.t=now;say('Get in position')}
  return;
 }
 /* find the body: pixels that differ from the empty-room picture, cleaned with a 3x3 vote */
 const m=new Uint8Array(3072);
 for(let k=0;k<3072;k++)if(Math.abs(g[k]-pu.bg[k])>30)m[k]=1;
 const mm=new Uint8Array(3072);
 for(let r=1;r<47;r++)for(let c=1;c<63;c++){let s=0;for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)s+=m[(r+a)*64+c+b];if(s>=5)mm[r*64+c]=1}
 let x0=64,x1=-1,y0=48,y1=-1,n=0;
 for(let r=0;r<48;r++)for(let c=0;c<64;c++)if(mm[r*64+c]){n++;if(c<x0)x0=c;if(c>x1)x1=c;if(r<y0)y0=r;if(r>y1)y1=r}
 const bw=x1-x0+1,bh=y1-y0+1;
 if(n<60||bw<12){cn.textContent=pu.ph==='pos'?'Get into your push-up position: '+Math.max(0,Math.ceil((5000-el)/1000)):'Body not in view';if(pu.ph==='count')pu.ok=0;return}
 if(pu.ph==='pos'){
  cn.textContent='Get into your push-up position: '+Math.max(0,Math.ceil((5000-el)/1000));
  if(el>=5000){
   /* lock in the starting pose: a wide, low body shape means a push-up position */
   if(bw<bh*1.3){pu.t=now-3000;cn.textContent='Lie in a push-up position, side-on to the phone, with your whole body in view';say('Side on, whole body in view');return}
   const sm=[0,0],cnt=[0,0];
   for(let r=y0;r<=y1;r++)for(let c=x0;c<=x1;c++)if(mm[r*64+c]){const h=c<(x0+x1)/2?0:1;sm[h]+=r;cnt[h]++}
   pu.head=(sm[0]/Math.max(1,cnt[0])<sm[1]/Math.max(1,cnt[1]))?0:1; /* the upper (higher on screen) end is the shoulders and head */
   pu.W0=bw;pu.top0=y0;pu.cx0=(x0+x1)/2;pu.hs=null;pu.mn=null;pu.mx=null;pu.pp=0;pu.ph='count';pu.t=now;pu.ok=0;say('Go');
  }
  return;
 }
 /* the shoulder and head end: column band at the upper end of the body */
 const bandW=Math.max(6,Math.round(bw*.3)),c0=pu.head===0?x0:x1-bandW+1;
 let top=47;for(let r=0;r<48;r++){let s=0;for(let c=c0;c<c0+bandW;c++)s+=mm[r*64+c];if(s>=2){top=r;break}}
 pu.hs=pu.hs===null?top:pu.hs*.55+top*.45;
 /* the feet end must stay put, so the dip is the upper body moving while the body stays long */
 const fx=pu.head===0?x1:x0;
 if(pu.fx0===undefined)pu.fx0=fx;
 const scale=Math.max(10,pu.W0*.34),need=Math.max(4,Math.round(scale*.5));
 const still=Math.abs(fx-pu.fx0)<=Math.max(4,pu.W0*.12)&&bw>pu.W0*.6;
 if(!still){cn.textContent='Hold your feet still. Move only your upper body.';if(pu.pp===1&&pu.t0&&now-pu.t0>1500)pu.pp=0;pu.t0=pu.t0||now;return}
 pu.t0=0;
 cn.textContent='Counting. Do your push-ups.';
 if(pu.mn===null){pu.mn=pu.mx=pu.hs}
 if(pu.pp===0){ if(pu.hs<pu.mn)pu.mn=pu.hs; if(pu.hs-pu.mn>=need){pu.pp=1;pu.mx=pu.hs} }
 else { if(pu.hs>pu.mx)pu.mx=pu.hs;
  if(pu.mx-pu.hs>=need*.8&&now-pu.last>600){pu.pp=0;pu.mn=pu.hs;pu.last=now;pu.n++;$('#pcn').textContent=pu.n;say(String(pu.n))}}
}
