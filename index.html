const KEY='reps.v1'; /* legacy storage name, kept so existing workouts survive the rename */
let S={history:[],unit:'lb',active:null},rest=null,tm=null,hasUnit=false;

 const r=localStorage.getItem(KEY);
 if(r){
  const p=JSON.parse(r);
  if(Array.isArray(p.history))S.history=p.history;
  if(p.unit==='kg'||p.unit==='lb'){S.unit=p.unit;hasUnit=true}
  const a=p.active;
  if(a&&typeof a.name==='string'&&typeof a.t==='number'&&Array.isArray(a.ex)&&a.ex.every(e=>e&&typeof e.n==='string'&&Array.isArray(e.sets))){
   S.active=a;
   if(typeof p.rest==='number'&&p.rest>Date.now())rest=p.rest;
   const t=p.tm;
   if(t&&a.ex[t.i]&&a.ex[t.i].sets[t.j]&&typeof t.end==='number')tm=t;
  }
 }
}catch(e){}
if(!hasUnit)S.unit=(S.history[S.history.length-1]||{}).u||'lb';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({history:S.history,unit:S.unit,active:S.active,tm:S.active?tm:null,rest:S.active?rest:null}))}catch(e){}};

 try{await tx('readwrite',s=>s.put({id:p.id,t:p.t,b}))}catch(e){}

function progv(){
 const h=S.history,now=Date.now(),W=6048e5;
 if(!h.length)return '<h1>Progress</h1><p class="empty">Finish a workout and your progress will show up here.</p>';
 const sets=h.reduce((n,w)=>n+w.ex.reduce((m,e)=>m+e.sets.length,0),0);
 const vol=h.reduce((n,w)=>n+w.ex.reduce((m,e)=>m+e.sets.reduce((k,s)=>k+(+s.w||0)*(+s.r||0),0),0),0);
 const bars=Array.from({length:8},(_,i)=>h.filter(w=>{const a=now-w.t;return a>=(7-i)*W&&a<(8-i)*W}).length),mx=Math.max(1,...bars);
 const names=[...new Set(h.flatMap(w=>w.ex.map(e=>e.n)))].sort();
 if(!names.includes(pe))pe=names[0];
 const isW=h.some(w=>w.ex.some(e=>e.n===pe&&e.sets.some(s=>+s.w>0)));
 const pts=h.filter(w=>w.ex.some(e=>e.n===pe)).map(w=>Math.max(...w.ex.find(x=>x.n===pe).sets.map(s=>+(isW?s.w:s.r)||0)));
 const lo=Math.min(...pts),hi=Math.max(...pts),sp=hi-lo||1,k=pts.length>1?280/(pts.length-1):0;
 const xy=pts.map((v,i)=>[pts.length>1?Math.round(10+i*k):150,Math.round(100-(v-lo)/sp*80)]);
 const unit=isW?S.unit:((L[pe]||{}).u||'reps'),d=pts[pts.length-1]-pts[0];
 return '<h1>Progress</h1><div class="tl"><div><b>'+h.length+'</b>workouts</div><div><b>'+bars[7]+'</b>last 7 days</div><div><b>'+sets+'</b>sets done</div><div><b>'+Math.round(vol).toLocaleString()+'</b>'+S.unit+' lifted</div></div>'+
 '<h2>Workouts per week</h2><div class="wb">'+bars.map(c=>'<i style="height:'+Math.round(c/mx*100)+'%"><b>'+c+'</b></i>').join('')+'</div><div class="wl"><span>8 weeks ago</span><span>last 7 days</span></div>'+
 '<h2>Exercise progress</h2><select id="pes" aria-label="Exercise">'+names.map(n=>'<option'+(n===pe?' selected':'')+'>'+esc(n)+'</option>').join('')+'</select>'+
 '<div class="cht"><svg viewBox="0 0 300 110" role="img" aria-label="Progress chart for '+esc(pe)+'"><polyline points="'+xy.map(q=>q.join(',')).join(' ')+'" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round"/>'+xy.map(q=>'<circle cx="'+q[0]+'" cy="'+q[1]+'" r="4" fill="var(--acc)"/>').join('')+'</svg></div>'+
 '<p class="sub">'+pts.length+' session'+(pts.length>1?'s':'')+'. First: '+pts[0]+' '+unit+'. Latest: '+pts[pts.length-1]+' '+unit+(pts.length>1?' ('+(d>=0?'+':'')+d+')':'')+'.</p>';
}

async function puStart(i){
 if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){showCam(BLOCK);return}
 try{const q=await navigator.permissions.query({name:'camera'});if(q.state==='denied'){showCam(BLOCK);return}}catch(e){}
 face='user';
 pu={i,ph:'ready',n:0,t:0,acc:null,na:0,bg:null,s:null,mn:null,mx:0,pp:0,last:0};
 const o=ov();o.hidden=false;
 o.innerHTML='<video id="cv" class="mir" playsinline muted autoplay></video><div class="cn" id="cn">Lean your phone upright, screen facing you, so your whole body is in view from the side. Tap Start, then step out of view.</div><div class="pc" id="pcn">0</div><div class="cb"><button class="cs" data-a="pux">Cancel</button><button class="cs" data-a="pum">-1</button><button class="cs" data-a="pugo">Start</button><button class="cs" data-a="pup">+1</button></div>';

function puLoop(){
 const v=$('#cv');if(!pu||!v||!v.videoWidth||pu.ph==='ready')return;
 const x=cvs.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,64,48);
 const D=x.getImageData(0,0,64,48).data,g=new Float32Array(3072);
 for(let k=0;k<3072;k++)g[k]=(D[4*k]+D[4*k+1]+D[4*k+2])/3;
 const now=Date.now(),el=now-pu.t,cn=$('#cn');
 if(pu.ph==='bg'){
  cn.textContent='Step out of view: '+Math.max(0,Math.ceil((3000-el)/1000));
  if(el>1500){if(!pu.acc)pu.acc=new Float32Array(3072);for(let k=0;k<3072;k++)pu.acc[k]+=g[k];pu.na++}
  if(el>=3000&&pu.na){pu.bg=pu.acc.map(q=>q/pu.na);pu.ph='pos';pu.t=now;say('Get in position')}
  return;
 }
 if(pu.ph==='pos'){
  cn.textContent='Get into your push-up position: '+Math.max(0,Math.ceil((5000-el)/1000));
  if(el>=5000){pu.ph='count';pu.t=now;say('Go')}
  return;
 }
 const rows=new Uint8Array(48);let area=0;
 for(let k=0;k<3072;k++)if(Math.abs(g[k]-pu.bg[k])>30){rows[(k/64)|0]++;area++}
 if(area<30){cn.textContent='Body not in view';return}
 let top=0;while(top<47&&rows[top]<3)top++;
 pu.s=pu.s===null?top:pu.s*.6+top*.4;
 if(pu.mn===null)pu.mn=pu.mx=pu.s;
 cn.textContent='Counting. Do your push-ups.';
 if(pu.pp===0){if(pu.s<pu.mn)pu.mn=pu.s;if(pu.s-pu.mn>4){pu.pp=1;pu.mx=pu.s}}
 else{if(pu.s>pu.mx)pu.mx=pu.s;if(pu.mx-pu.s>4&&now-pu.last>350){pu.pp=0;pu.mn=pu.s;pu.last=now;pu.n++;$('#pcn').textContent=pu.n;say(String(pu.n))}}
}
